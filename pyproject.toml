[project]
name = "wikidata-pilot"
dynamic = ["version"]
description = "Review and stage evidence-backed Wikidata edits"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE.md"}
dependencies = [
    "httpx>=0.27",
    "playwright>=1.50",
    "pydantic>=2.10",
    "quickstatements-client>=0.1.2",
]

[project.scripts]
wikidata-pilot = "wikidata_pilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version has one home: the package's __init__.py. Nothing else stores it,
# so nothing else can disagree with it.
path = "src/wikidata_pilot/__init__.py"
pattern = "^__version__(?::\\s*str)?\\s*=\\s*['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["src/wikidata_pilot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "mypy>=1.15",
]

[tool.ruff]
# Match requires-python.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by the formatter)
]

[tool.mypy]
python_version = "3.10"
strict = true
# Required with a src/ layout and no tests/__init__.py: without them mypy
# resolves tests/test_x.py as top-level `test_x`, so the `tests.*` override
# below silently never matches. mypy_path stops the package being discovered
# twice (as src.pkg and pkg), which is a hard error.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
# Test bodies are the assertion; annotating every fixture buys nothing.
# disallow_untyped_calls follows it, or typed tests calling untyped helpers
# re-report the same noise under a different code.
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wikidata_pilot --cov-fail-under=90"

[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md", "CLAUDE.md"]
